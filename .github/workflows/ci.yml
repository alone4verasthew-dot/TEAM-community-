name: TFY checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarize dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r = require("./npm-audit.json"); const v = r.vulnerabilities || {}; console.log("Full dependency tree:"); console.log(JSON.stringify({ counts: r.metadata?.vulnerabilities, packages: Object.entries(v).map(([name, x]) => ({ name, severity: x.severity, range: x.range, fixAvailable: x.fixAvailable, via: x.via.map(y => typeof y === "string" ? y : y.title) })) }, null, 2))'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const r = require("./npm-audit-production.json"); const v = r.vulnerabilities || {}; console.log("Production dependencies only:"); console.log(JSON.stringify({ counts: r.metadata?.vulnerabilities, packages: Object.entries(v).map(([name, x]) => ({ name, severity: x.severity, range: x.range, fixAvailable: x.fixAvailable, via: x.via.map(y => typeof y === "string" ? y : y.title) })) }, null, 2))'
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
